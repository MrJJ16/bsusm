<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembantu BSUSM</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; padding: 10px; display: flex; justify-content: center; }
    .chat-container { width: 100%; max-width: 500px; height: 95vh; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e1e4e8; }
    .chat-header { background: #0b57d0; color: white; padding: 15px; font-weight: bold; text-align: center; font-size: 1.1rem; border-bottom: 2px solid #0842a0; }
    .chat-header span { font-size: 0.8rem; font-weight: normal; display: block; opacity: 0.8; margin-top: 3px; }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .user { align-self: flex-end; background: #0b57d0; color: white; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #e9ecef; color: #212529; border-bottom-left-radius: 2px; border: 1px solid #dee2e6; }
    .input-container { display: flex; padding: 10px; background: #ffffff; border-top: 1px solid #dee2e6; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ced4da; border-radius: 20px; outline: none; font-size: 0.95rem; }
    input[type="text"]:focus { border-color: #0b57d0; }
    button { background: #0b57d0; color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button:hover { background: #0842a0; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      Pembantu AI Sirkulasi
      <span>Bahagian Sirkulasi (BSUSM)</span>
    </div>
    <div id="chatBox" class="chat-box">
      <div class="message bot">Salam sejahtera! Saya Pembantu AI Bahagian Sirkulasi. Ada apa yang boleh saya bantu berkenaan sirkulasi, laporan, atau dashboard hari ini?</div>
    </div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Taip soalan anda di sini..." onkeypress="handleKeyPress(event)" />
      <button id="sendBtn" onclick="sendMessage()">Hantar</button>
    </div>
  </div>

  <script>
    // MASUKKAN GEMINI API KEY ANDA DI SINI
    const API_KEY = 'GANTI_GEMINI_API_KEY_ANDA';

    // Sejarah Perbualan untuk kekalkan konteks soalan
    let chatHistory = [
      {
        role: "user",
        parts: [{ text: "Anda adalah pembantu maya rasmi untuk Bahagian Sirkulasi (BSUSM). Tugas anda adalah menjawab soalan berkenaan perkhidmatan sirkulasi, laporan, dan dashboard dengan sopan dan jelas dalam Bahasa Melayu." }]
      },
      {
        role: "model",
        parts: [{ text: "Faham. Saya sedia membantu sebagai Pembantu AI Bahagian Sirkulasi (BSUSM)." }]
      }
    ];

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();

      if (!text) return;

      // Papar mesej pengguna
      appendMessage(text, 'user');
      input.value = '';
      sendBtn.disabled = true;

      // Simpan ke sejarah perbualan
      chatHistory.push({ role: "user", parts: [{ text: text }] });

      // Papar indikator loading
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message bot';
      loadingDiv.id = 'loading';
      loadingDiv.innerText = 'Sedang memikirkan jawapan...';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: chatHistory })
        });

        const data = await response.json();
        chatBox.removeChild(document.getElementById('loading'));

        if (data.candidates && data.candidates[0].content) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage(reply, 'bot');
          chatHistory.push({ role: "model", parts: [{ text: reply }] });
        } else {
          appendMessage("Maaf, terdapat ralat teknikal. Sila cuba lagi.", 'bot');
        }
      } catch (err) {
        if(document.getElementById('loading')) chatBox.removeChild(document.getElementById('loading'));
        appendMessage("Ralat sambungan. Sila pastikan API Key anda betul.", 'bot');
      }

      sendBtn.disabled = false;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }
  </script>

</body>
</html>
