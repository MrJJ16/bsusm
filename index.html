<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Bulanan · Perpustakaan Hamzah Sendut</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<body class="bg-slate-100">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ═══════════════════════════════════════════════════
//  GANTI dengan Web App URL Apps Script anda
// ═══════════════════════════════════════════════════
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwje0ctkMQubF24bOR_9popfgGlo5ZLGBhZ35nL1mepGgQy2og_raQNz577kBNky6O/exec";

const REFRESH_INTERVAL_MS = 60 * 1000;
const MONTHS = ["JANUARI","FEBRUARI","MAC","APRIL","MEI","JUN","JULAI","OGOS","SEPTEMBER","OKTOBER","NOVEMBER","DISEMBER"];

function getPrevMonth(m) {
  const i = MONTHS.indexOf(m);
  return i > 0 ? MONTHS[i - 1] : null;
}
function calcCum(entry, month) {
  const mi = MONTHS.indexOf(month);
  let t = 0;
  for (let i = 0; i <= mi; i++) t += (entry[MONTHS[i]] || 0);
  return t;
}
function fmt(n) {
  return (n || 0).toLocaleString('en-MY');
}
function fmtDash(n) {
  if (!n) return '-';
  return n.toLocaleString('en-MY');
}

/** Kira % perubahan: positif = naik, negatif = turun */
function pctChange(current, prev) {
  const c = current || 0, p = prev || 0;
  if (p === 0) return c > 0 ? 100 : 0;
  return parseFloat((((c - p) / p) * 100).toFixed(1));
}

/** Teks analisa ringkas */
function analysisText(current, prev, month, prevMonth) {
  if (!prevMonth) return 'Tiada bulan sebelumnya untuk perbandingan.';
  const c = current || 0, p = prev || 0;
  const pct = pctChange(c, p);
  const diff = c - p;
  if (pct === 0 && diff === 0) {
    return `Tiada perubahan berbanding ${prevMonth} (kekal ${fmt(c)}).`;
  }
  if (pct > 0) {
    return `Menaik ${Math.abs(pct)}% berbanding ${prevMonth} (dari ${fmt(p)} ke ${fmt(c)}, +${fmt(diff)}).`;
  }
  return `Menurun ${Math.abs(pct)}% berbanding ${prevMonth} (dari ${fmt(p)} ke ${fmt(c)}, ${fmt(diff)}).`;
}

/** Komponen kotak analisa bawah graf */
function AnalysisBox({ current, prev, month, prevMonth, items }) {
  if (!prevMonth) return null;
  const pct = pctChange(current, prev);
  const up = pct > 0;
  const flat = pct === 0;
  const color = flat ? 'bg-slate-50 border-slate-200 text-slate-700' : up ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800';
  const icon = flat ? 'fa-minus' : up ? 'fa-arrow-up' : 'fa-arrow-down';
  return (
    <div className={`mt-3 rounded-lg border px-4 py-3 text-sm ${color}`}>
      <div className="flex items-start gap-2">
        <i className={`fas ${icon} mt-0.5`}></i>
        <div>
          <p className="font-semibold">
            {flat ? 'Tiada perubahan' : up ? `Menaik ${Math.abs(pct)}%` : `Menurun ${Math.abs(pct)}%`}
            <span className="font-normal opacity-80"> vs {prevMonth}</span>
          </p>
          <p className="text-xs mt-0.5 opacity-90">{analysisText(current, prev, month, prevMonth)}</p>
          {items && items.length > 0 && (
            <ul className="mt-2 text-xs space-y-0.5 opacity-90">
              {items.map((it, i) => {
                const ip = pctChange(it.current, it.prev);
                if (it.prev === 0 && it.current === 0) return null;
                return (
                  <li key={i}>
                    <strong>{it.name}:</strong>{' '}
                    {ip > 0 ? `▲ naik ${Math.abs(ip)}%` : ip < 0 ? `▼ turun ${Math.abs(ip)}%` : '— sama'}{' '}
                    ({fmt(it.prev)} → {fmt(it.current)})
                  </li>
                );
              })}
            </ul>
          )}
        </div>
      </div>
    </div>
  );
}

async function fetchSheetData(year) {
  let url = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
  if (year) url += '&year=' + encodeURIComponent(year);
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error('Apps Script tidak pulangkan JSON. Semak Deploy (Anyone) & URL.'); }
  if (data.error || data.ok === false) throw new Error(data.error || 'Ralat API');
  return data;
}

function chartLabelB(e) {
  const cat = (e.category || '').toLowerCase();
  const item = e.item || '';
  let prefix = '';
  if (cat.indexOf('phs') >= 0 || cat.indexOf('dalaman') >= 0) prefix = 'Dalaman';
  else if (cat.indexOf('institusi') >= 0 || cat.indexOf('luar') >= 0) prefix = 'Institusi Luar';
  let status = item;
  if (/proses/i.test(item) || /process/i.test(item)) status = 'In Process';
  else if (/berjaya/i.test(item)) status = 'Berjaya';
  else if (/gagal/i.test(item)) status = 'Gagal';
  return prefix ? `${prefix} ${status}` : status;
}

const hatchStyle = {
  backgroundImage: 'repeating-linear-gradient(45deg, #1d4ed8 0, #1d4ed8 1.5px, #dbeafe 1.5px, #dbeafe 5px)',
  border: '1px solid #1d4ed8'
};

// ── CSS bar charts (untuk laporan cetak) ──
function ChartByCategory({ entries, month, prevMonth, title }) {
  const cats = {};
  entries.forEach(e => {
    const c = e.category || e.item || 'Lain';
    if (!cats[c]) cats[c] = { name: c, current: 0, prev: 0 };
    cats[c].current += (e[month] || 0);
    if (prevMonth) cats[c].prev += (e[prevMonth] || 0);
  });
  const items = Object.values(cats);
  const max = Math.max(...items.flatMap(i => [i.current, i.prev]), 1);
  const chartH = 200;
  return (
    <div className="mt-4 mb-2 border border-slate-200 rounded-lg p-4 bg-white">
      <h3 className="text-center font-bold text-sm mb-3 tracking-wide uppercase">{title}</h3>
      <div className="flex">
        <div className="flex flex-col justify-between text-[10px] text-slate-500 pr-2 text-right w-10" style={{height: chartH}}>
          <span>{fmt(max)}</span><span>{fmt(Math.round(max*0.5))}</span><span>0</span>
        </div>
        <div className="flex-1 flex items-end justify-center gap-6 border-b border-l border-slate-300" style={{height: chartH}}>
          {items.map(it => (
            <div key={it.name} className="flex flex-col items-center">
              <div className="flex items-end gap-1">
                {prevMonth && (
                  <div className="flex flex-col items-center" style={{width: 28}}>
                    <span className="text-[9px] font-bold mb-0.5">{fmt(it.prev)}</span>
                    <div style={{ width:'100%', height: Math.max(3,(it.prev/max)*chartH*0.9), background:'#2563eb', borderRadius:'2px 2px 0 0' }} />
                  </div>
                )}
                <div className="flex flex-col items-center" style={{width: 28}}>
                  <span className="text-[9px] font-bold mb-0.5">{fmt(it.current)}</span>
                  <div style={{ width:'100%', height: Math.max(3,(it.current/max)*chartH*0.9), borderRadius:'2px 2px 0 0', ...hatchStyle }} />
                </div>
              </div>
              <div className="text-[10px] text-center mt-2 font-semibold max-w-[90px] leading-tight">{it.name}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="flex justify-center gap-5 text-xs mt-3 text-slate-600">
        {prevMonth && <span className="flex items-center gap-1.5"><span className="w-4 h-3 bg-blue-600 rounded-sm"></span>{prevMonth}</span>}
        <span className="flex items-center gap-1.5"><span className="w-4 h-3 rounded-sm" style={hatchStyle}></span>{month}</span>
      </div>
      <AnalysisBox
        current={items.reduce((s,i)=>s+i.current,0)}
        prev={items.reduce((s,i)=>s+i.prev,0)}
        month={month} prevMonth={prevMonth}
        items={items}
      />
    </div>
  );
}

function ChartByItemB({ entries, month, prevMonth, title }) {
  const max = Math.max(...entries.flatMap(e => [e[month]||0, prevMonth ? (e[prevMonth]||0) : 0]), 1);
  const chartH = 200;
  return (
    <div className="mt-4 mb-2 border border-slate-200 rounded-lg p-4 bg-white">
      <h3 className="text-center font-bold text-sm mb-3 tracking-wide uppercase">{title}</h3>
      <div className="flex">
        <div className="flex flex-col justify-between text-[10px] text-slate-500 pr-2 text-right w-8" style={{height: chartH}}>
          <span>{fmt(max)}</span><span>{fmt(Math.round(max*0.5))}</span><span>0</span>
        </div>
        <div className="flex-1 flex items-end justify-around border-b border-l border-slate-300 px-2" style={{height: chartH}}>
          {entries.map(e => {
            const cur = e[month] || 0;
            const prev = prevMonth ? (e[prevMonth] || 0) : 0;
            return (
              <div key={e.id} className="flex flex-col items-center" style={{minWidth: 55}}>
                <div className="flex items-end gap-0.5">
                  {prevMonth && (
                    <div className="flex flex-col items-center" style={{width: 20}}>
                      <span className="text-[8px] font-bold mb-0.5">{fmt(prev)}</span>
                      <div style={{ width:'100%', height: Math.max(2,(prev/max)*chartH*0.88), background:'#2563eb', borderRadius:'2px 2px 0 0' }} />
                    </div>
                  )}
                  <div className="flex flex-col items-center" style={{width: 20}}>
                    <span className="text-[8px] font-bold mb-0.5">{fmt(cur)}</span>
                    <div style={{ width:'100%', height: Math.max(2,(cur/max)*chartH*0.88), borderRadius:'2px 2px 0 0', ...hatchStyle }} />
                  </div>
                </div>
                <div className="text-[9px] text-center mt-2 max-w-[72px] leading-tight font-medium">{chartLabelB(e)}</div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="flex justify-center gap-5 text-xs mt-3 text-slate-600">
        {prevMonth && <span className="flex items-center gap-1.5"><span className="w-4 h-3 bg-blue-600 rounded-sm"></span>{prevMonth}</span>}
        <span className="flex items-center gap-1.5"><span className="w-4 h-3 rounded-sm" style={hatchStyle}></span>{month}</span>
      </div>
      <AnalysisBox
        current={entries.reduce((s,e)=>s+(e[month]||0),0)}
        prev={prevMonth ? entries.reduce((s,e)=>s+(e[prevMonth]||0),0) : 0}
        month={month} prevMonth={prevMonth}
        items={entries.map(e => ({ name: chartLabelB(e), current: e[month]||0, prev: prevMonth ? (e[prevMonth]||0) : 0 }))}
      />
    </div>
  );
}

function ChartByItem({ entries, month, prevMonth, title }) {
  const max = Math.max(...entries.flatMap(e => [e[month]||0, prevMonth ? (e[prevMonth]||0) : 0]), 1);
  const chartH = 180;
  return (
    <div className="mt-4 mb-2 border border-slate-200 rounded-lg p-4 bg-white">
      <h3 className="text-center font-bold text-sm mb-3 tracking-wide">{title}</h3>
      <div className="flex">
        <div className="flex flex-col justify-between text-[10px] text-slate-500 pr-2 text-right w-8" style={{height: chartH}}>
          <span>{fmt(max)}</span><span>{fmt(Math.round(max*0.5))}</span><span>0</span>
        </div>
        <div className="flex-1 flex items-end justify-center gap-3 border-b border-l border-slate-300" style={{height: chartH}}>
          {entries.map(e => {
            const cur = e[month]||0, prev = prevMonth ? (e[prevMonth]||0) : 0;
            return (
              <div key={e.id} className="flex flex-col items-center" style={{minWidth:48}}>
                <div className="flex items-end gap-0.5">
                  {prevMonth && (
                    <div className="flex flex-col items-center" style={{width:18}}>
                      <span className="text-[8px] font-bold mb-0.5">{fmt(prev)}</span>
                      <div style={{width:'100%', height:Math.max(2,(prev/max)*chartH*0.88), background:'#2563eb', borderRadius:'2px 2px 0 0'}} />
                    </div>
                  )}
                  <div className="flex flex-col items-center" style={{width:18}}>
                    <span className="text-[8px] font-bold mb-0.5">{fmt(cur)}</span>
                    <div style={{width:'100%', height:Math.max(2,(cur/max)*chartH*0.88), borderRadius:'2px 2px 0 0', ...hatchStyle}} />
                  </div>
                </div>
                <div className="text-[9px] text-center mt-1.5 max-w-[70px] leading-tight">{e.item}</div>
              </div>
            );
          })}
        </div>
      </div>
      <AnalysisBox
        current={entries.reduce((s,e)=>s+(e[month]||0),0)}
        prev={prevMonth ? entries.reduce((s,e)=>s+(e[prevMonth]||0),0) : 0}
        month={month} prevMonth={prevMonth}
        items={entries.map(e => ({ name: e.item, current: e[month]||0, prev: prevMonth ? (e[prevMonth]||0) : 0 }))}
      />
    </div>
  );
}

// ── Section laporan ──
function SectionBlock({ sectionName, entries, month, prevMonth, year, isFirst }) {
  const format = entries[0]?.format || 2;
  const displayCols = prevMonth ? [prevMonth, month] : [month];
  const isA = sectionName.indexOf('PERKHIDMATAN KOLEKSI') >= 0;
  const isB = sectionName.indexOf('PINJAMAN ANTARA') >= 0;

  if (format === 1) {
    const cats = {};
    entries.forEach(e => {
      const c = e.category || 'Lain-lain';
      if (!cats[c]) cats[c] = [];
      cats[c].push(e);
    });
    let gMonth = 0, gPrev = 0, gCum = 0;

    return (
      <div className="print-section bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        {isFirst && (
          <div className="mb-5 pb-3 border-b-2 border-slate-800">
            <div className="text-lg font-extrabold">BAHAGIAN SIRKULASI</div>
            <div className="text-base font-bold">PERPUSTAKAAN HAMZAH SENDUT</div>
            <div className="text-base font-bold">LAPORAN BULANAN {month} {year}</div>
          </div>
        )}
        <h2 className="text-base font-bold mb-3">{sectionName}</h2>
        {isB ? (
          <table className="w-full border-collapse text-sm mb-4">
            <thead>
              <tr className="bg-slate-100">
                <th className="border border-black px-3 py-2 text-center font-bold">JENIS PERMOHONAN</th>
                <th className="border border-black px-3 py-2 text-center font-bold">STATUS</th>
                {displayCols.map(c => <th key={c} className="border border-black px-3 py-2 text-center font-bold w-24">{c}</th>)}
                <th className="border border-black px-3 py-2 text-center font-bold w-28">KUMULATIF {month}</th>
              </tr>
            </thead>
            <tbody>
              {Object.entries(cats).map(([catName, items]) => {
                const cM = items.reduce((s,e)=>s+(e[month]||0),0);
                const cP = prevMonth ? items.reduce((s,e)=>s+(e[prevMonth]||0),0) : 0;
                const cC = items.reduce((s,e)=>s+calcCum(e,month),0);
                return (
                  <React.Fragment key={catName}>
                    {items.map((item, idx) => (
                      <tr key={item.id}>
                        {idx === 0 && (
                          <td className="border border-black px-3 py-1.5 font-semibold text-center align-middle" rowSpan={items.length + 1}>{catName}</td>
                        )}
                        <td className="border border-black px-3 py-1.5 text-center">{item.item}</td>
                        {displayCols.map(c => (
                          <td key={c} className="border border-black px-3 py-1.5 text-center">
                            {fmtDash(c === month ? (item[month]||0) : (item[prevMonth]||0))}
                          </td>
                        ))}
                        <td className="border border-black px-3 py-1.5 text-center">{fmt(calcCum(item, month))}</td>
                      </tr>
                    ))}
                    <tr className="bg-slate-50 font-semibold">
                      <td className="border border-black px-3 py-1.5 text-center">Jumlah permohonan</td>
                      {displayCols.map(c => (
                        <td key={c} className="border border-black px-3 py-1.5 text-center">{fmt(c===month?cM:cP)}</td>
                      ))}
                      <td className="border border-black px-3 py-1.5 text-center">{fmt(cC)}</td>
                    </tr>
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        ) : (
          <table className="w-full border-collapse text-sm mb-4">
            <thead>
              <tr className="bg-slate-100">
                <th className="border border-black px-3 py-2 text-center font-bold" colSpan="2">KATEGORI</th>
                {displayCols.map(c => <th key={c} className="border border-black px-3 py-2 text-center font-bold w-28">{c}</th>)}
                <th className="border border-black px-3 py-2 text-center font-bold w-28">KUMULATIF</th>
              </tr>
            </thead>
            <tbody>
              {Object.entries(cats).map(([catName, items]) => {
                const cM = items.reduce((s,e)=>s+(e[month]||0),0);
                const cP = prevMonth ? items.reduce((s,e)=>s+(e[prevMonth]||0),0) : 0;
                const cC = items.reduce((s,e)=>s+calcCum(e,month),0);
                gMonth += cM; gPrev += cP; gCum += cC;
                return (
                  <React.Fragment key={catName}>
                    {items.map((item, idx) => (
                      <tr key={item.id}>
                        {idx === 0 && <td className="border border-black px-3 py-1.5 font-bold align-top" rowSpan={items.length}>{catName}</td>}
                        <td className="border border-black px-3 py-1.5">{item.item}</td>
                        {displayCols.map(c => (
                          <td key={c} className="border border-black px-3 py-1.5 text-center">
                            {fmt(c === month ? (item[month]||0) : (item[prevMonth]||0))}
                          </td>
                        ))}
                        <td className="border border-black px-3 py-1.5 text-center">{fmt(calcCum(item, month))}</td>
                      </tr>
                    ))}
                    <tr className="bg-slate-50 font-semibold">
                      <td className="border border-black px-3 py-1.5" colSpan="2">Jumlah</td>
                      {displayCols.map(c => (
                        <td key={c} className="border border-black px-3 py-1.5 text-center">{fmt(c===month?cM:cP)}</td>
                      ))}
                      <td className="border border-black px-3 py-1.5 text-center">{fmt(cC)}</td>
                    </tr>
                  </React.Fragment>
                );
              })}
              <tr className="bg-slate-200 font-bold">
                <td className="border border-black px-3 py-2" colSpan="2">JUMLAH BESAR</td>
                {displayCols.map(c => (
                  <td key={c} className="border border-black px-3 py-2 text-center">{fmt(c===month?gMonth:gPrev)}</td>
                ))}
                <td className="border border-black px-3 py-2 text-center">{fmt(gCum)}</td>
              </tr>
            </tbody>
          </table>
        )}
        {isA && <ChartByCategory entries={entries} month={month} prevMonth={prevMonth} title="PERKHIDMATAN KOLEKSI" />}
        {isB && <ChartByItemB entries={entries} month={month} prevMonth={prevMonth} title="PINJAMAN ANTARA PERPUSTAKAAN" />}
        {!isA && !isB && <ChartByCategory entries={entries} month={month} prevMonth={prevMonth} title={sectionName} />}
      </div>
    );
  }

  let gM = 0, gP = 0, gC = 0;
  return (
    <div className="print-section bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
      {isFirst && (
        <div className="mb-5 pb-3 border-b-2 border-slate-800">
          <div className="text-lg font-extrabold">BAHAGIAN SIRKULASI</div>
          <div className="text-base font-bold">PERPUSTAKAAN HAMZAH SENDUT</div>
          <div className="text-base font-bold">LAPORAN BULANAN {month} {year}</div>
        </div>
      )}
      <h2 className="text-base font-bold mb-3">{sectionName}</h2>
      <table className="w-full border-collapse text-sm mb-4">
        <thead>
          <tr className="bg-slate-100">
            <th className="border border-black px-3 py-2 text-left font-bold">KATEGORI</th>
            {displayCols.map(c => <th key={c} className="border border-black px-3 py-2 text-center font-bold w-28">{c}</th>)}
            <th className="border border-black px-3 py-2 text-center font-bold w-28">KUMULATIF</th>
          </tr>
        </thead>
        <tbody>
          {entries.map(item => {
            const cur = item[month]||0, prev = prevMonth?(item[prevMonth]||0):0, cum = calcCum(item,month);
            gM += cur; gP += prev; gC += cum;
            return (
              <tr key={item.id}>
                <td className="border border-black px-3 py-1.5">{item.item}</td>
                {displayCols.map(c => (
                  <td key={c} className="border border-black px-3 py-1.5 text-center">{fmt(c===month?cur:prev)}</td>
                ))}
                <td className="border border-black px-3 py-1.5 text-center">{fmt(cum)}</td>
              </tr>
            );
          })}
          <tr className="bg-slate-100 font-bold">
            <td className="border border-black px-3 py-2">JUMLAH</td>
            {displayCols.map(c => (
              <td key={c} className="border border-black px-3 py-2 text-center">{fmt(c===month?gM:gP)}</td>
            ))}
            <td className="border border-black px-3 py-2 text-center">{fmt(gC)}</td>
          </tr>
        </tbody>
      </table>
      <ChartByItem entries={entries} month={month} prevMonth={prevMonth} title={sectionName} />
    </div>
  );
}

// ── DOC download ──
function downloadDoc(grouped, month, prevMonth, year) {
  const displayCols = prevMonth ? [prevMonth, month] : [month];
  const th = (t, w) => `<th style="border:1px solid #000;padding:5px 6px;background:#e8e8e8;text-align:center;font-size:10pt${w?';width:'+w:''}">${t}</th>`;
  const td = (t, center, bold) => `<td style="border:1px solid #000;padding:4px 6px;font-size:10pt;${center?'text-align:center;':''}${bold?'font-weight:bold;':''}">${t}</td>`;

  let body = `
    <div style="text-align:center;margin-bottom:18px">
      <p style="margin:0;font-size:14pt;font-weight:bold">BAHAGIAN SIRKULASI</p>
      <p style="margin:2px 0;font-size:12pt;font-weight:bold">PERPUSTAKAAN HAMZAH SENDUT</p>
      <p style="margin:2px 0 0;font-size:12pt;font-weight:bold">LAPORAN BULANAN ${month} ${year}</p>
    </div>`;

  let grandCur = 0, grandPrev = 0;

  grouped.forEach(([sectionName, entries], secIdx) => {
    const format = entries[0]?.format || 2;
    const isB = sectionName.indexOf('PINJAMAN ANTARA') >= 0;
    let secCur = 0, secPrev = 0;
    const itemLines = [];

    // Page break + tajuk seksyen
    body += `<p style="margin:0 0 8px;font-size:11pt;font-weight:bold;${secIdx > 0 ? 'page-break-before:always;' : ''}">${sectionName}</p>`;

    if (format === 1 && isB) {
      // Format B: Jenis | Status | bulan | kumulatif
      const cats = {};
      entries.forEach(e => { const c = e.category || 'Lain'; if (!cats[c]) cats[c]=[]; cats[c].push(e); });
      body += `<table style="border-collapse:collapse;width:100%;margin-bottom:6px">
        <tr>${th('JENIS PERMOHONAN')}${th('STATUS')}${displayCols.map(c=>th(c)).join('')}${th('KUMULATIF')}</tr>`;
      Object.entries(cats).forEach(([catName, items]) => {
        const cM = items.reduce((s,e)=>s+(e[month]||0),0);
        const cP = prevMonth ? items.reduce((s,e)=>s+(e[prevMonth]||0),0) : 0;
        const cC = items.reduce((s,e)=>s+calcCum(e,month),0);
        secCur += cM; secPrev += cP;
        itemLines.push({ name: catName, current: cM, prev: cP });
        items.forEach((item, idx) => {
          const cur = item[month]||0, prev = prevMonth ? (item[prevMonth]||0) : 0;
          body += `<tr>`;
          if (idx === 0) body += `<td style="border:1px solid #000;padding:4px 6px;font-size:10pt;font-weight:bold;text-align:center;vertical-align:middle" rowspan="${items.length+1}">${catName}</td>`;
          body += td(item.item, true);
          displayCols.forEach(c => { body += td(fmt(c===month?cur:prev), true); });
          body += td(fmt(calcCum(item,month)), true);
          body += `</tr>`;
        });
        body += `<tr style="font-weight:bold">${td('Jumlah permohonan', true, true)}`;
        displayCols.forEach(c => { body += td(fmt(c===month?cM:cP), true, true); });
        body += td(fmt(cC), true, true) + `</tr>`;
      });
      body += `</table>`;
    } else if (format === 1) {
      const cats = {};
      entries.forEach(e => { const c = e.category || 'Lain'; if (!cats[c]) cats[c]=[]; cats[c].push(e); });
      body += `<table style="border-collapse:collapse;width:100%;margin-bottom:6px">
        <tr>${th('KATEGORI')}${th('ITEM')}${displayCols.map(c=>th(c)).join('')}${th('KUMULATIF')}</tr>`;
      let gM=0, gP=0, gC=0;
      Object.entries(cats).forEach(([catName, items]) => {
        items.forEach((item, idx) => {
          const cur = item[month]||0, prev = prevMonth ? (item[prevMonth]||0) : 0;
          body += `<tr>`;
          if (idx === 0) body += `<td style="border:1px solid #000;padding:4px 6px;font-size:10pt;font-weight:bold;vertical-align:top" rowspan="${items.length}">${catName}</td>`;
          body += td(item.item);
          displayCols.forEach(c => { body += td(fmt(c===month?cur:prev), true); });
          body += td(fmt(calcCum(item,month)), true) + `</tr>`;
        });
        const cM = items.reduce((s,e)=>s+(e[month]||0),0);
        const cP = prevMonth ? items.reduce((s,e)=>s+(e[prevMonth]||0),0) : 0;
        const cC = items.reduce((s,e)=>s+calcCum(e,month),0);
        gM += cM; gP += cP; gC += cC;
        itemLines.push({ name: catName, current: cM, prev: cP });
        body += `<tr>${td('Jumlah', false, true)}${td('', false, true)}`;
        displayCols.forEach(c => { body += td(fmt(c===month?cM:cP), true, true); });
        body += td(fmt(cC), true, true) + `</tr>`;
      });
      secCur = gM; secPrev = gP;
      body += `<tr>${td('JUMLAH BESAR', false, true)}${td('', false, true)}`;
      displayCols.forEach(c => { body += td(fmt(c===month?gM:gP), true, true); });
      body += td(fmt(gC), true, true) + `</tr></table>`;
    } else {
      body += `<table style="border-collapse:collapse;width:100%;margin-bottom:6px">
        <tr>${th('KATEGORI')}${displayCols.map(c=>th(c)).join('')}${th('KUMULATIF')}</tr>`;
      let gM=0, gP=0, gC=0;
      entries.forEach(item => {
        const cur = item[month]||0, prev = prevMonth ? (item[prevMonth]||0) : 0, cum = calcCum(item,month);
        gM += cur; gP += prev; gC += cum;
        itemLines.push({ name: item.item, current: cur, prev: prev });
        body += `<tr>${td(item.item)}`;
        displayCols.forEach(c => { body += td(fmt(c===month?cur:prev), true); });
        body += td(fmt(cum), true) + `</tr>`;
      });
      secCur = gM; secPrev = gP;
      body += `<tr>${td('JUMLAH', false, true)}`;
      displayCols.forEach(c => { body += td(fmt(c===month?gM:gP), true, true); });
      body += td(fmt(gC), true, true) + `</tr></table>`;
    }

    grandCur += secCur;
    grandPrev += secPrev;

    // Ulasan — teks biasa sahaja
    if (prevMonth) {
      const pct = pctChange(secCur, secPrev);
      const label = pct > 0 ? 'Menaik' : pct < 0 ? 'Menurun' : 'Tiada perubahan';
      body += `<p style="margin:6px 0 14px;font-size:10pt"><b>Ulasan:</b> ${label}${pct !== 0 ? ' ' + Math.abs(pct) + '%' : ''} berbanding ${prevMonth} (dari ${fmt(secPrev)} kepada ${fmt(secCur)}).`;
      const detail = itemLines.filter(it => it.current > 0 || it.prev > 0).slice(0, 6);
      if (detail.length) {
        body += ' ' + detail.map(it => {
          const ip = pctChange(it.current, it.prev);
          const t = ip > 0 ? 'naik ' + Math.abs(ip) + '%' : ip < 0 ? 'turun ' + Math.abs(ip) + '%' : 'sama';
          return it.name + ' ' + t;
        }).join('; ') + '.';
      }
      body += `</p>`;
    }
  });

  if (prevMonth && grouped.length) {
    const gp = pctChange(grandCur, grandPrev);
    const label = gp > 0 ? 'Menaik' : gp < 0 ? 'Menurun' : 'Tiada perubahan';
    body += `<p style="margin-top:20px;page-break-before:always;font-size:11pt;font-weight:bold">RINGKASAN KESELURUHAN</p>
      <p style="font-size:10pt"><b>Jumlah semua bahagian:</b> ${fmt(grandPrev)} (${prevMonth}) kepada ${fmt(grandCur)} (${month}).
      <b>Ulasan:</b> ${label}${gp !== 0 ? ' ' + Math.abs(gp) + '%' : ''} berbanding ${prevMonth}.</p>`;
  }

  const html = `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">
<head><meta charset="utf-8">
<style>
  @page { size: A4; margin: 2.5cm; }
  body { font-family: Calibri, Arial, sans-serif; font-size: 11pt; }
  table { border-collapse: collapse; width: 100%; page-break-inside: avoid; }
  p { page-break-after: avoid; }
</style>
</head><body>${body}</body></html>`;

  const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Laporan_Bulanan_${month}_${year}.doc`;
  a.click();
  URL.revokeObjectURL(a.href);
}


// ── DASHBOARD (Chart.js) — semua seksyen ──
function DashboardView({ entries, month, prevMonth, year, sections }) {
  const sectionChartsRef = useRef({});
  const overviewRef = useRef(null);
  const trendTotalRef = useRef(null);
  const trendMultiRef = useRef(null);
  const charts = useRef({});

  // Agregat setiap seksyen
  const sectionStats = useMemo(() => {
    const map = {};
    entries.forEach(e => {
      const s = e.section || 'Lain';
      if (!map[s]) map[s] = { name: s, current: 0, prev: 0, items: [] };
      map[s].current += (e[month] || 0);
      if (prevMonth) map[s].prev += (e[prevMonth] || 0);
      map[s].items.push({
        name: e.category ? `${e.category}: ${e.item}` : (e.item || ''),
        current: e[month] || 0,
        prev: prevMonth ? (e[prevMonth] || 0) : 0
      });
    });
    const order = (sections && sections.length) ? sections : Object.keys(map);
    return order.filter(s => map[s]).map(s => {
      const st = map[s];
      st.pct = pctChange(st.current, st.prev);
      return st;
    });
  }, [entries, month, prevMonth, sections]);

  const grandCurrent = sectionStats.reduce((s, x) => s + x.current, 0);
  const grandPrev = sectionStats.reduce((s, x) => s + x.prev, 0);
  const grandPct = pctChange(grandCurrent, grandPrev);

  // Trend bulanan: jumlah semua seksyen + top 5 seksyen
  const monthlyTrend = useMemo(() => {
    const bySection = {};
    entries.forEach(e => {
      const s = e.section || 'Lain';
      if (!bySection[s]) {
        bySection[s] = {};
        MONTHS.forEach(m => { bySection[s][m] = 0; });
      }
      MONTHS.forEach(m => { bySection[s][m] += (e[m] || 0); });
    });
    const total = MONTHS.map(m =>
      Object.values(bySection).reduce((sum, sec) => sum + (sec[m] || 0), 0)
    );
    // Top 5 seksyen mengikut jumlah kumulatif
    const ranked = Object.entries(bySection)
      .map(([name, vals]) => ({
        name,
        total: MONTHS.reduce((s, m) => s + (vals[m] || 0), 0),
        data: MONTHS.map(m => vals[m] || 0)
      }))
      .sort((a, b) => b.total - a.total)
      .slice(0, 5);
    return { total, ranked };
  }, [entries]);

  const colors = [
    '#2563eb', '#7c3aed', '#059669', '#d97706', '#dc2626',
    '#0891b2', '#4f46e5', '#16a34a', '#ea580c', '#db2777',
    '#0d9488', '#6366f1', '#84cc16', '#f59e0b'
  ];

  useEffect(() => {
    Object.values(charts.current).forEach(c => { try { c.destroy(); } catch(e){} });
    charts.current = {};

    // Overview bar — semua seksyen
    if (overviewRef.current && sectionStats.length) {
      charts.current.overview = new Chart(overviewRef.current, {
        type: 'bar',
        data: {
          labels: sectionStats.map(s => {
            // pendekkan label
            const n = s.name;
            if (n.length > 28) return n.substring(0, 26) + '…';
            return n;
          }),
          datasets: [
            ...(prevMonth ? [{
              label: prevMonth,
              data: sectionStats.map(s => s.prev),
              backgroundColor: '#2563eb',
              borderRadius: 4
            }] : []),
            {
              label: month,
              data: sectionStats.map(s => s.current),
              backgroundColor: '#93c5fd',
              borderColor: '#1d4ed8',
              borderWidth: 1,
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' },
            title: { display: true, text: `Ringkasan Semua Bahagian — ${month} ${year}` },
            tooltip: {
              callbacks: {
                afterBody: (items) => {
                  if (!prevMonth || !items.length) return '';
                  const i = items[0].dataIndex;
                  const st = sectionStats[i];
                  const p = st.pct;
                  return p > 0 ? `▲ Naik ${Math.abs(p)}%` : p < 0 ? `▼ Turun ${Math.abs(p)}%` : 'Tiada perubahan';
                }
              }
            }
          },
          scales: {
            x: { ticks: { maxRotation: 45, minRotation: 30, font: { size: 9 } } },
            y: { beginAtZero: true }
          }
        }
      });
    }

    // Trend keseluruhan (line)
    if (trendTotalRef.current && monthlyTrend.total) {
      charts.current.trendTotal = new Chart(trendTotalRef.current, {
        type: 'line',
        data: {
          labels: MONTHS.map(m => m.substring(0, 3)),
          datasets: [{
            label: 'Jumlah semua bahagian',
            data: monthlyTrend.total,
            borderColor: '#1d4ed8',
            backgroundColor: 'rgba(37, 99, 235, 0.12)',
            fill: true,
            tension: 0.35,
            pointRadius: 5,
            pointHoverRadius: 7,
            pointBackgroundColor: '#1d4ed8',
            borderWidth: 2.5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'bottom' },
            title: { display: true, text: 'Tren Bulanan Keseluruhan — ' + year },
            tooltip: {
              callbacks: {
                afterLabel: (ctx) => {
                  const i = ctx.dataIndex;
                  if (i === 0) return '';
                  const cur = monthlyTrend.total[i] || 0;
                  const prev = monthlyTrend.total[i - 1] || 0;
                  const p = pctChange(cur, prev);
                  if (p > 0) return '▲ Naik ' + Math.abs(p) + '% vs bulan lepas';
                  if (p < 0) return '▼ Turun ' + Math.abs(p) + '% vs bulan lepas';
                  return 'Tiada perubahan vs bulan lepas';
                }
              }
            }
          },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // Trend multi-line top 5 seksyen
    if (trendMultiRef.current && monthlyTrend.ranked && monthlyTrend.ranked.length) {
      const palette = ['#2563eb', '#7c3aed', '#059669', '#d97706', '#dc2626'];
      charts.current.trendMulti = new Chart(trendMultiRef.current, {
        type: 'line',
        data: {
          labels: MONTHS.map(m => m.substring(0, 3)),
          datasets: monthlyTrend.ranked.map((sec, i) => ({
            label: sec.name.length > 30 ? sec.name.substring(0, 28) + '…' : sec.name,
            data: sec.data,
            borderColor: palette[i % palette.length],
            backgroundColor: 'transparent',
            tension: 0.3,
            pointRadius: 3,
            pointHoverRadius: 6,
            borderWidth: 2
          }))
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'bottom', labels: { font: { size: 10 }, boxWidth: 12 } },
            title: { display: true, text: 'Tren 5 Bahagian Utama — ' + year }
          },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // Carta per seksyen
    sectionStats.forEach((st, idx) => {
      const canvas = sectionChartsRef.current[st.name];
      if (!canvas) return;
      const topItems = st.items
        .filter(it => it.current > 0 || it.prev > 0)
        .slice(0, 8);
      if (!topItems.length) return;

      charts.current['sec_' + idx] = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: topItems.map(it => it.name.length > 22 ? it.name.substring(0, 20) + '…' : it.name),
          datasets: [
            ...(prevMonth ? [{
              label: prevMonth,
              data: topItems.map(it => it.prev),
              backgroundColor: '#2563eb',
              borderRadius: 3
            }] : []),
            {
              label: month,
              data: topItems.map(it => it.current),
              backgroundColor: colors[idx % colors.length],
              borderRadius: 3
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { size: 10 } } },
            title: { display: false }
          },
          scales: {
            x: { ticks: { font: { size: 9 }, maxRotation: 40 } },
            y: { beginAtZero: true }
          }
        }
      });
    });

    return () => {
      Object.values(charts.current).forEach(c => { try { c.destroy(); } catch(e){} });
    };
  }, [sectionStats, monthlyTrend, month, prevMonth, year]);

  const kpiCard = (title, value, sub, color) => (
    <div className={`rounded-2xl p-4 text-white shadow-lg ${color}`}>
      <p className="text-xs opacity-90 font-medium leading-tight">{title}</p>
      <p className="text-2xl font-bold mt-1">{fmt(value)}</p>
      {sub && <p className="text-[11px] mt-1.5 opacity-90">{sub}</p>}
    </div>
  );

  return (
    <div className="space-y-6">
      <div>
        <h2 className="text-xl font-bold text-slate-800">Dashboard Interaktif — Semua Bahagian</h2>
        <p className="text-sm text-slate-500">{month} {year} · Data live dari Google Sheet · Hover carta untuk nilai tepat</p>
      </div>

      {/* KPI keseluruhan */}
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        {kpiCard(
          'Jumlah Keseluruhan',
          grandCurrent,
          prevMonth ? `${grandPct >= 0 ? '▲' : '▼'} ${Math.abs(grandPct)}% vs ${prevMonth} (${fmt(grandPrev)})` : null,
          'bg-gradient-to-br from-slate-700 to-slate-900'
        )}
        {sectionStats.slice(0, 3).map((st, i) => {
          const grads = [
            'bg-gradient-to-br from-blue-600 to-blue-800',
            'bg-gradient-to-br from-violet-500 to-violet-700',
            'bg-gradient-to-br from-emerald-500 to-emerald-700'
          ];
          const short = st.name.length > 32 ? st.name.substring(0, 30) + '…' : st.name;
          return (
            <div key={st.name}>
              {kpiCard(
                short,
                st.current,
                prevMonth ? `${st.pct >= 0 ? '▲ naik' : '▼ turun'} ${Math.abs(st.pct)}% vs ${prevMonth}` : null,
                grads[i]
              )}
            </div>
          );
        })}
      </div>

      {/* KPI grid semua seksyen */}
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <h3 className="font-bold text-slate-800 mb-3">Ringkasan % perubahan semua tajuk</h3>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b-2 border-slate-200 text-left text-slate-600">
                <th className="py-2 pr-3">Bahagian</th>
                {prevMonth && <th className="py-2 px-2 text-center">{prevMonth}</th>}
                <th className="py-2 px-2 text-center">{month}</th>
                <th className="py-2 px-2 text-center">Perubahan</th>
                <th className="py-2 pl-2">Analisa</th>
              </tr>
            </thead>
            <tbody>
              {sectionStats.map(st => (
                <tr key={st.name} className="border-b border-slate-100 hover:bg-slate-50">
                  <td className="py-2.5 pr-3 font-medium text-slate-800">{st.name}</td>
                  {prevMonth && <td className="py-2.5 px-2 text-center">{fmt(st.prev)}</td>}
                  <td className="py-2.5 px-2 text-center font-semibold">{fmt(st.current)}</td>
                  <td className="py-2.5 px-2 text-center">
                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold ${
                      st.pct > 0 ? 'bg-emerald-100 text-emerald-700' :
                      st.pct < 0 ? 'bg-red-100 text-red-700' :
                      'bg-slate-100 text-slate-600'
                    }`}>
                      {st.pct > 0 ? '▲' : st.pct < 0 ? '▼' : '—'} {Math.abs(st.pct)}%
                    </span>
                  </td>
                  <td className="py-2.5 pl-2 text-xs text-slate-600">
                    {!prevMonth ? '—' :
                      st.pct > 0 ? `Menaik berbanding ${prevMonth}` :
                      st.pct < 0 ? `Menurun berbanding ${prevMonth}` :
                      'Tiada perubahan'}
                  </td>
                </tr>
              ))}
              <tr className="bg-slate-100 font-bold">
                <td className="py-2.5 pr-3">JUMLAH</td>
                {prevMonth && <td className="py-2.5 px-2 text-center">{fmt(grandPrev)}</td>}
                <td className="py-2.5 px-2 text-center">{fmt(grandCurrent)}</td>
                <td className="py-2.5 px-2 text-center">
                  <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold ${
                    grandPct > 0 ? 'bg-emerald-100 text-emerald-700' :
                    grandPct < 0 ? 'bg-red-100 text-red-700' :
                    'bg-slate-200 text-slate-600'
                  }`}>
                    {grandPct > 0 ? '▲' : grandPct < 0 ? '▼' : '—'} {Math.abs(grandPct)}%
                  </span>
                </td>
                <td className="py-2.5 pl-2 text-xs">{analysisText(grandCurrent, grandPrev, month, prevMonth)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      {/* Overview chart */}
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <div style={{height: 340}}><canvas ref={overviewRef}></canvas></div>
        <AnalysisBox current={grandCurrent} prev={grandPrev} month={month} prevMonth={prevMonth} />
      </div>

      {/* Visualisasi tren */}
      <div>
        <h3 className="font-bold text-slate-800 mb-1">Visualisasi Tren</h3>
        <p className="text-xs text-slate-500 mb-3">Garis masa Januari–Disember · Hover untuk nilai & % vs bulan lepas</p>
        <div className="grid grid-cols-1 gap-5">
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <div style={{height: 300}}><canvas ref={trendTotalRef}></canvas></div>
          </div>
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <div style={{height: 320}}><canvas ref={trendMultiRef}></canvas></div>
          </div>
        </div>
      </div>

      {/* Carta setiap seksyen */}
      <div>
        <h3 className="font-bold text-slate-800 mb-3">Carta mengikut tajuk / bahagian</h3>
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
          {sectionStats.map((st, idx) => (
            <div key={st.name} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
              <div className="flex items-start justify-between gap-2 mb-2">
                <h4 className="text-sm font-bold text-slate-800 leading-tight">{st.name}</h4>
                <span className={`shrink-0 text-xs font-bold px-2 py-0.5 rounded-full ${
                  st.pct > 0 ? 'bg-emerald-100 text-emerald-700' :
                  st.pct < 0 ? 'bg-red-100 text-red-700' :
                  'bg-slate-100 text-slate-600'
                }`}>
                  {st.pct > 0 ? '▲' : st.pct < 0 ? '▼' : '—'} {Math.abs(st.pct)}%
                </span>
              </div>
              <div style={{height: 220}}>
                <canvas ref={el => { if (el) sectionChartsRef.current[st.name] = el; }}></canvas>
              </div>
              <AnalysisBox
                current={st.current}
                prev={st.prev}
                month={month}
                prevMonth={prevMonth}
                items={st.items.filter(it => it.current > 0 || it.prev > 0).slice(0, 6)}
              />
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── APP ──
function App() {
  const [entries, setEntries] = useState([]);
  const [sections, setSections] = useState([]);
  const [month, setMonth] = useState('JULAI');
  const [year, setYear] = useState(2026);
  const [availableYears, setAvailableYears] = useState([2026]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [lastUpdate, setLastUpdate] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [view, setView] = useState('dashboard'); // dashboard | laporan

  const load = useCallback(async (silent, yearOverride) => {
    const y = yearOverride !== undefined ? yearOverride : year;
    if (!silent) setLoading(true); else setRefreshing(true);
    setError('');
    try {
      const data = await fetchSheetData(y);
      if (data.dataEntries && data.dataEntries.length) {
        setEntries(data.dataEntries);
        setSections(data.sections || []);
        setLastUpdate(data.updatedAt || new Date().toISOString());
        if (data.year) setYear(data.year);
        if (data.availableYears && data.availableYears.length) setAvailableYears(data.availableYears);
      } else setError('Tiada data untuk tahun ini. Semak tab Sheet (contoh: Data 2026).');
    } catch (err) {
      setError(err.message || 'Gagal memuatkan data');
    }
    setLoading(false); setRefreshing(false);
  }, [year]);

  useEffect(() => {
    load(false);
    const t = setInterval(() => load(true), REFRESH_INTERVAL_MS);
    return () => clearInterval(t);
  }, []);

  const prevMonth = getPrevMonth(month);
  const grouped = useMemo(() => {
    const g = {};
    entries.forEach(e => { if (!g[e.section]) g[e.section]=[]; g[e.section].push(e); });
    const ordered = (sections.length ? sections : Object.keys(g)).filter(s => g[s]);
    return ordered.map(s => [s, g[s]]);
  }, [entries, sections]);

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-center">
          <i className="fas fa-spinner fa-spin text-4xl text-blue-600 mb-3"></i>
          <p className="text-slate-600">Memuatkan data dari Google Sheet...</p>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen">
      <div className="no-print bg-gradient-to-r from-slate-800 to-blue-700 text-white px-4 py-4 shadow-lg">
        <div className="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 className="text-xl font-bold">Laporan Bulanan · Bahagian Sirkulasi</h1>
            <p className="text-sm text-blue-100">Perpustakaan Hamzah Sendut · Live Google Sheet</p>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <select value={year} onChange={e=>{ const y=parseInt(e.target.value,10); setYear(y); load(false, y); }}
              className="px-3 py-2 rounded-lg text-slate-800 font-semibold text-sm">
              {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
            </select>
            <select value={month} onChange={e=>setMonth(e.target.value)} className="px-3 py-2 rounded-lg text-slate-800 font-semibold text-sm">
              {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
            <button onClick={()=>load(true)} disabled={refreshing}
              className="px-3 py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-semibold">
              <i className={`fas fa-sync-alt ${refreshing?'fa-spin':''} mr-1`}></i>Refresh
            </button>
            {view === 'laporan' && (
              <>
                <button onClick={()=>downloadDoc(grouped, month, prevMonth, year)} disabled={!grouped.length}
                  className="px-3 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg text-sm font-bold">
                  <i className="fas fa-file-word mr-1"></i>Download DOC
                </button>
                <button onClick={()=>window.print()}
                  className="px-3 py-2 bg-white text-blue-800 rounded-lg text-sm font-bold">
                  <i className="fas fa-print mr-1"></i>Cetak / PDF
                </button>
              </>
            )}
          </div>
        </div>
        <div className="max-w-6xl mx-auto mt-3 flex flex-wrap items-center gap-2">
          <button onClick={()=>setView('dashboard')}
            className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition ${view==='dashboard'?'bg-white text-blue-800':'bg-white/15 hover:bg-white/25'}`}>
            <i className="fas fa-chart-pie mr-1.5"></i>Dashboard
          </button>
          <button onClick={()=>setView('laporan')}
            className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition ${view==='laporan'?'bg-white text-blue-800':'bg-white/15 hover:bg-white/25'}`}>
            <i className="fas fa-file-alt mr-1.5"></i>Laporan Bulanan
          </button>
          <span className="text-xs text-blue-200 ml-auto">
            <i className="fas fa-database mr-1"></i>{entries.length} rekod
            {lastUpdate && <> · {new Date(lastUpdate).toLocaleString('ms-MY')}</>}
          </span>
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-4 py-6">
        {error && (
          <div className="no-print mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
            <strong>Ralat:</strong> {error}
          </div>
        )}

        {view === 'dashboard' && (
          <DashboardView entries={entries} month={month} prevMonth={prevMonth} year={year} sections={sections} />
        )}

        {view === 'laporan' && grouped.map(([name, items], idx) => (
          <SectionBlock key={name} sectionName={name} entries={items}
            month={month} prevMonth={prevMonth} year={year} isFirst={idx===0} />
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
